<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-labelledby="t d">
  <title id="t">The journey of one shipment</title>
  <desc id="d">Five steps light up in turn: Scan the receipt, Pay the seller, Seal the manifest, Track checkpoints, Customs clears.</desc>
  <style>
    .bg{fill:#0b3b3a}
    .rail{stroke:#2f8a84;stroke-width:4;stroke-linecap:round}
    .prog{stroke:#f4f1ea;stroke-width:4;stroke-linecap:round;stroke-dasharray:900;stroke-dashoffset:900;animation:run 10s ease-in-out infinite}
    @keyframes run{0%{stroke-dashoffset:900}80%,92%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
    .dot{fill:#0f5f5c;stroke:#2f8a84;stroke-width:3}
    .on{fill:#f4f1ea;opacity:0;animation:lit 10s ease-in-out infinite}
    .s1{animation-delay:0s}.s2{animation-delay:1.7s}.s3{animation-delay:3.4s}.s4{animation-delay:5.1s}.s5{animation-delay:6.8s}
    @keyframes lit{0%{opacity:0;transform:scale(.4)}4%{opacity:1;transform:scale(1.25)}8%,88%{opacity:1;transform:scale(1)}96%,100%{opacity:0}}
    .dot2,.on{transform-box:fill-box;transform-origin:center}
    .t{font:700 20px "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f4f1ea}
    .d{font:400 14px "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;fill:#b7d5d1}
    .i{font:700 16px "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;fill:#0b3b3a;text-anchor:middle;opacity:0;animation:lit 10s ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.on,.i{opacity:1}.prog{stroke-dashoffset:0}}
  </style>
  <rect class="bg" width="1200" height="230" rx="20"/>
  <path class="rail" d="M120 84 H1080"/>
  <path class="prog" d="M120 84 H1080"/>
  <g>
    <circle class="dot" cx="120" cy="84" r="22"/><circle class="on s1" cx="120" cy="84" r="22"/><text class="i s1" x="120" y="90">1</text>
    <circle class="dot" cx="360" cy="84" r="22"/><circle class="on s2" cx="360" cy="84" r="22"/><text class="i s2" x="360" y="90">2</text>
    <circle class="dot" cx="600" cy="84" r="22"/><circle class="on s3" cx="600" cy="84" r="22"/><text class="i s3" x="600" y="90">3</text>
    <circle class="dot" cx="840" cy="84" r="22"/><circle class="on s4" cx="840" cy="84" r="22"/><text class="i s4" x="840" y="90">4</text>
    <circle class="dot" cx="1080" cy="84" r="22"/><circle class="on s5" cx="1080" cy="84" r="22"/><text class="i s5" x="1080" y="90">5</text>
  </g>
  <g text-anchor="middle">
    <text class="t" x="120" y="140">Scan</text><text class="d" x="120" y="164">Photo of the Chinese</text><text class="d" x="120" y="184">receipt, read + translated</text>
    <text class="t" x="360" y="140">Pay</text><text class="d" x="360" y="164">Sandbox yuan, PIN-gated,</text><text class="d" x="360" y="184">seller counter-signs</text>
    <text class="t" x="600" y="140">Seal</text><text class="d" x="600" y="164">Manifest signed on the</text><text class="d" x="600" y="184">phone, QR issued</text>
    <text class="t" x="840" y="140">Track</text><text class="d" x="840" y="164">GPS checkpoints, signed,</text><text class="d" x="840" y="184">queued offline</text>
    <text class="t" x="1080" y="140">Clear</text><text class="d" x="1080" y="164">Customs re-verifies every</text><text class="d" x="1080" y="184">signature, then decides</text>
  </g>
</svg>
